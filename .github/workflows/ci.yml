name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The committed lockfile is only a root manifest, not a complete npm v3 lock.
      # Use npm install until a complete lockfile is generated.
      - run: npm install
      - run: npm run lint
      - run: npm run build
